name: Android APK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate release configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ ! "$API_BASE_URL" =~ ^https://.+/api$ ]]; then
            echo "Set the API_BASE_URL Actions variable to your deployed HTTPS API URL ending in /api."
            exit 1
          fi
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "Set the ANDROID_DEBUG_KEYSTORE_BASE64 Actions secret to a persistent Android signing keystore."
            exit 1
          fi

      - name: Install persistent Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Generate platform runners
        working-directory: mobile
        run: python bootstrap.py

      - name: Build release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mobile/build/app/outputs/flutter-apk/app-release.apk