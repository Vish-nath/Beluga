name: beluga_health
description: Offline nursing assistant – meal, medication & checkup reminders.
publish_to: none
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  table_calendar: ^3.1.3
  image_picker: ^1.1.2
  intl: ^0.19.0
  sqflite_common_ffi_web: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
